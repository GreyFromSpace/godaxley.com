  html { background-image: none; }
  /* Metatron's Cube stays on the front page; posts get the living lattice below */
  body::after, .bar::before { display: none; }
  body { font-size: 1rem; }
  .page { max-width: min(100%, calc(66ch * 1.125 + 8rem)); }
  .masthead, .page > * { position: relative; z-index: 2; }

  .lattice-cv { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  .prose {
    align-self: center; box-sizing: border-box;
    width: min(100%, calc(64ch + 2 * clamp(1em, 4vw, 2.6em) + 3px));
    gap: 1.1em;
    background: #171117;                  /* the sheet: one solid, calm surface */
    border: 1px solid var(--rule);
    border-left: 2px solid var(--teal);
    padding: 2.2em clamp(1em, 4vw, 2.6em) 2.6em;
    font-family: "Iosevka Aile", var(--font);
    font-size: 1.125rem;                  /* 18px at a default browser; follows the reader */
    line-height: 1.7;
  }
  .prose .hl { background: none; padding: 0; }
  .prose h2, .prose h3 { font-family: var(--font); margin: 2.2rem 0 .9rem; }
  .prose h2:first-child { margin-top: 0; }
</style>
