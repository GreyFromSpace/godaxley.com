<style>
  /* ---------- reading layout, blog posts only (2026-11-11) ----------
     Long posts get one solid sheet behind the words: no lattice, grain or motion
     under any line of text, no per-line smoked-glass panes. Lines run about 64
     characters and body text is 1.125rem Aile. The site-wide part (lattice, fonts,
     amber title) lives at the end of styles.html. */
  .page { max-width: min(100%, calc(66ch * 1.125 + 8rem)); }
  .prose {
    align-self: center; box-sizing: border-box;
    width: min(100%, calc(64ch + 2 * clamp(1em, 4vw, 2.6em) + 3px));
    gap: 1.1em;
    background: #171117;                  /* the sheet: one solid, calm surface */
    border: 1px solid var(--rule);
    border-left: 2px solid var(--teal);
    padding: 2.2em clamp(1em, 4vw, 2.6em) 2.6em;
    font-family: var(--prose);
    font-size: 1.125rem;                  /* 18px at a default browser; follows the reader */
    line-height: 1.7;
    color: var(--warm);                   /* Grey's words to the reader (2.2) */
  }
  .prose .hl { background: none; padding: 0; }
  .prose h2, .prose h3 { font-family: var(--font); color: var(--teal); margin: 2.2rem 0 .9rem; }
  .prose h2:first-child { margin-top: 0; }
  .prose strong, .prose em { color: var(--warm-hi); }
</style>
