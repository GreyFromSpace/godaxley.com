# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# The editor at godaxley.com/admin. Saving a post commits a Markdown file to
# _posts/ in this repo; GitHub Pages rebuilds the site with Jekyll and the
# post is live about a minute later.

backend:
  name: github
  repo: GreyFromSpace/godaxley.com
  branch: main
  # Token only: the OAuth button goes through Netlify, which this site does
  # not use, so it just opened a "Not Found" popup.
  auth_methods: [token]
  commit_messages:
    create: "Post: {{slug}}"
    update: "Post edit: {{slug}}"
    delete: "Post deleted: {{slug}}"
    uploadMedia: "Image: {{path}}"
    deleteMedia: "Image deleted: {{path}}"

site_url: https://godaxley.com
display_url: https://godaxley.com/blog/
logo:
  src: /og-logo.jpg

media_folder: /media/blog
public_folder: /media/blog

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: /_posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "/blog/{{filename}}/"
    sortable_fields: [date, title]
    summary: "{{title}} · {{date | date('YYYY-MM-DD')}}{{published | ternary('', ' · draft')}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - label: Summary
        name: description
        widget: string
        required: false
        hint: "One line under the title, and the preview text when the link is shared."
      - label: Published
        name: published
        widget: boolean
        default: true
        hint: "Turn off to keep it as a draft: saved, but not on the site."
      - label: Audio
        name: audio
        widget: file
        required: false
        accept: audio/*
        hint: "Optional. An audio file (mp3, ogg, m4a). A player appears under the title. Keep it under about 50 MB."
      - { label: Body, name: body, widget: richtext }
