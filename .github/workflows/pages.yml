# Builds the site with build.py and publishes it to GitHub Pages on every push
# to main - including the commits the /admin editor makes when a post is saved.
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown==3.5.2 pyyaml==6.0.1
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          # v3 on purpose: v4 drops dot-folders, and .well-known/matrix is what
          # points Matrix clients at the chat server.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
